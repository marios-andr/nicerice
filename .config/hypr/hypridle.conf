general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
# lock_cmd = playerctl --all-players pause && pidof hyprlock || hyprlock  # pause all system audio and avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # to avoid having to press a key twice to turn on the display.
}

# TODO: check for fullscreen before sleeping

listener {
    timeout = 480                                # 8min.
    on-timeout = playerctl -a status 2>/dev/null | grep -q Playing || brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

# turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
# listener { 
#     timeout = 480                                          # 8min.
#     on-timeout = brightnessctl -sd rgb:kbd_backlight set 0 # turn off keyboard backlight.
#     on-resume = brightnessctl -rd rgb:kbd_backlight        # turn on keyboard backlight.
# }

listener {
    timeout = 600                                 # 10min
    on-timeout = playerctl -a status 2>/dev/null | grep -q Playing || loginctl lock-session   # skip lock if media is playing
}

listener {
    timeout = 660                                                     # 11min
    on-timeout = playerctl -a status 2>/dev/null | grep -q Playing || hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'   # skip screen off if media is playing
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r          # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 1800                                # 30min
    on-timeout = playerctl -a status 2>/dev/null | grep -q Playing || systemctl suspend   # skip suspend if media is playing
}